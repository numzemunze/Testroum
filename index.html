<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<title>Testroum</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 14px; left: 14px; font-size: 11px; opacity: 0.55;
    pointer-events: none; letter-spacing: 0.4px; line-height: 1.6; }
  #info { position: fixed; bottom: 96px; left: 12px; right: 12px;
    background: rgba(18, 22, 40, 0.94); backdrop-filter: blur(12px);
    border-radius: 14px; padding: 14px 16px; font-size: 13px;
    display: none; border: 1px solid rgba(76, 201, 240, 0.35);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-height: 40vh; overflow-y: auto; }
  #info .title { font-weight: 700; margin-bottom: 6px; color: #4cc9f0; font-size: 14px; }
  #info .row { opacity: 0.85; font-size: 12px; margin-top: 4px; line-height: 1.5; }
  #info .row b { color: #ffd166; font-weight: 600; }
  #info .close { position: absolute; top: 10px; right: 14px; opacity: 0.5; font-size: 20px; cursor: pointer; }
  #controls { position: fixed; bottom: 16px; left: 12px; right: 12px; display: flex; gap: 8px; }
  button { flex: 1; padding: 14px 10px; border-radius: 12px;
    background: rgba(76, 201, 240, 0.12); color: #4cc9f0; font-size: 13px;
    font-weight: 600; border: 1px solid rgba(76, 201, 240, 0.4);
    backdrop-filter: blur(12px); cursor: pointer; transition: background 0.15s; }
  button:active { background: rgba(76, 201, 240, 0.35); transform: scale(0.98); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: #0a0a14; z-index: 10;
    font-size: 13px; transition: opacity 0.4s; }
  #loading .bar { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  #loading .bar div { height: 100%; width: 0%; background: #4cc9f0; transition: width 0.2s; }
  #loading .pct { opacity: 0.6; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="loading">
  <div>Loading MaleCNS connectome</div>
  <div class="bar"><div id="loadbar"></div></div>
  <div class="pct" id="loadpct">0%</div>
</div>
<div id="hud">-</div>
<div id="info"></div>
<div id="controls">
  <button id="btn-stim">Stimulate</button>
  <button id="btn-reset">Reset camera</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.FogExp2(0x0a0a14, 0.0009);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 5000);
camera.position.set(0, 0, 1200);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;
controls.minDistance = 150;
controls.maxDistance = 3000;

// ---------------------------------------------------------------
// Type to color mapping (hash based, consistent across sessions)
// ---------------------------------------------------------------
function hashStringToHue(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) | 0;
  }
  return (Math.abs(h) % 360) / 360;
}

const typeColorCache = new Map();
function colorForType(type) {
  if (typeColorCache.has(type)) return typeColorCache.get(type);
  const hue = hashStringToHue(type);
  const color = new THREE.Color().setHSL(hue, 0.65, 0.6);
  typeColorCache.set(type, color);
  return color;
}

// ---------------------------------------------------------------
// State (filled after brain.json loads)
// ---------------------------------------------------------------
let neurons = null;
let instancedMesh = null;
let edgesLine = null;
let adjacency = null;
let baseColors = null;
let typeCounts = null;
const NEURON_RADIUS = 2.4;

// ---------------------------------------------------------------
// Load brain.json with progress
// ---------------------------------------------------------------
const loadbar = document.getElementById('loadbar');
const loadpct = document.getElementById('loadpct');
const loadingEl = document.getElementById('loading');

async function loadBrain() {
  const response = await fetch('brain.json');
  if (!response.ok) throw new Error('Failed to fetch brain.json: ' + response.status);

  const total = +response.headers.get('content-length') || 0;
  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (total) {
      const pct = Math.round((received / total) * 100);
      loadbar.style.width = pct + '%';
      loadpct.textContent = pct + '%';
    } else {
      loadpct.textContent = (received / 1024 / 1024).toFixed(1) + ' MB';
    }
  }

  const blob = new Blob(chunks);
  const text = await blob.text();
  return JSON.parse(text);
}

// ---------------------------------------------------------------
// Build neurons
// ---------------------------------------------------------------
function buildNeurons(data) {
  neurons = data.nodes;
  const count = neurons.length;
  baseColors = new Float32Array(count * 3);
  typeCounts = new Map();

  const geo = new THREE.SphereGeometry(NEURON_RADIUS, 5, 4);
  const mat = new THREE.MeshBasicMaterial();
  instancedMesh = new THREE.InstancedMesh(geo, mat, count);
  instancedMesh.frustumCulled = false;

  const dummy = new THREE.Object3D();

  for (let i = 0; i < count; i++) {
    const n = neurons[i];
    dummy.position.set(n.x, n.y, n.z);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);

    const color = colorForType(n.type);
    instancedMesh.setColorAt(i, color);
    baseColors[i * 3] = color.r;
    baseColors[i * 3 + 1] = color.g;
    baseColors[i * 3 + 2] = color.b;

    typeCounts.set(n.type, (typeCounts.get(n.type) || 0) + 1);
  }

  instancedMesh.instanceMatrix.needsUpdate = true;
  instancedMesh.instanceColor.needsUpdate = true;
  scene.add(instancedMesh);
}

// ---------------------------------------------------------------
// Build edges and adjacency map
// ---------------------------------------------------------------
function buildEdges(data) {
  const edges = data.edges;
  const positions = new Float32Array(edges.length * 6);
  adjacency = new Array(neurons.length);
  for (let i = 0; i < neurons.length; i++) adjacency[i] = [];

  for (let i = 0; i < edges.length; i++) {
    const e = edges[i];
    const a = neurons[e.source];
    const b = neurons[e.target];
    const o = i * 6;
    positions[o] = a.x;
    positions[o + 1] = a.y;
    positions[o + 2] = a.z;
    positions[o + 3] = b.x;
    positions[o + 4] = b.y;
    positions[o + 5] = b.z;

    adjacency[e.source].push({ target: e.target, weight: e.weight });
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.LineBasicMaterial({
    color: 0x2a4a7a,
    transparent: true,
    opacity: 0.18,
    depthWrite: false
  });

  edgesLine = new THREE.LineSegments(geo, mat);
  edgesLine.frustumCulled = false;
  scene.add(edgesLine);
}

// ---------------------------------------------------------------
// Tap detection with pixel radius
// ---------------------------------------------------------------
const infoEl = document.getElementById('info');
const raycaster = new THREE.Raycaster();
let pointerDownTime = 0, pointerDownX = 0, pointerDownY = 0;
let highlightedIdx = -1;
const tmpColor = new THREE.Color();
const WHITE = new THREE.Color(0xffffff);

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownTime = performance.now();
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const dt = performance.now() - pointerDownTime;
  const dx = e.clientX - pointerDownX;
  const dy = e.clientY - pointerDownY;
  if (dt > 350 || Math.hypot(dx, dy) > 12) return;

  const rect = renderer.domElement.getBoundingClientRect();
  const tapX = e.clientX - rect.left;
  const tapY = e.clientY - rect.top;
  const TAP_RADIUS_PX = 45;

  let bestIdx = -1;
  let bestDist = TAP_RADIUS_PX;
  const v = new THREE.Vector3();

  for (let i = 0; i < neurons.length; i++) {
    const n = neurons[i];
    v.set(n.x, n.y, n.z).project(camera);
    if (v.z > 1) continue;
    const sx = (v.x * 0.5 + 0.5) * rect.width;
    const sy = (-v.y * 0.5 + 0.5) * rect.height;
    const dist = Math.hypot(sx - tapX, sy - tapY);
    if (dist < bestDist) {
      bestDist = dist;
      bestIdx = i;
    }
  }

  if (bestIdx !== -1) {
    showInfo(bestIdx);
    highlightNeuron(bestIdx);
  } else {
    infoEl.style.display = 'none';
  }
});

function highlightNeuron(idx) {
  if (highlightedIdx !== -1 && highlightedIdx !== idx) {
    const prev = neurons[highlightedIdx];
    const c = colorForType(prev.type);
    instancedMesh.setColorAt(highlightedIdx, c);
  }
  instancedMesh.setColorAt(idx, WHITE);
  instancedMesh.instanceColor.needsUpdate = true;
  highlightedIdx = idx;
}

function showInfo(idx) {
  const n = neurons[idx];
  const out = adjacency[idx].length;
  let inCount = 0;
  for (let i = 0; i < neurons.length; i++) {
    for (const conn of adjacency[i]) {
      if (conn.target === idx) { inCount++; break; }
    }
  }

  infoEl.innerHTML = `
    <div class="close" onclick="document.getElementById('info').style.display='none'">x</div>
    <div class="title">Neuron #${idx}</div>
    <div class="row">Type: <b>${n.type}</b></div>
    <div class="row">Outgoing links: <b>${out}</b></div>
    <div class="row">Incoming links: <b>${inCount}</b></div>
    <div class="row">Position: ${n.x.toFixed(1)}, ${n.y.toFixed(1)}, ${n.z.toFixed(1)}</div>
  `;
  infoEl.style.display = 'block';
}

// ---------------------------------------------------------------
// Stimulation: BFS wave through real connections
// ---------------------------------------------------------------
let activeStim = null;

function stimulate(startIdx) {
  const MAX_HOPS = 4;
  const PER_HOP = 40;

  const visited = new Set([startIdx]);
  const layers = [[startIdx]];

  for (let hop = 0; hop < MAX_HOPS; hop++) {
    const prev = layers[layers.length - 1];
    const next = [];
    for (const idx of prev) {
      const neighbors = adjacency[idx].slice().sort((a, b) => b.weight - a.weight);
      for (const conn of neighbors) {
        if (next.length >= PER_HOP * (hop + 1)) break;
        if (!visited.has(conn.target)) {
          visited.add(conn.target);
          next.push(conn.target);
        }
      }
      if (next.length >= PER_HOP * (hop + 1)) break;
    }
    if (next.length === 0) break;
    layers.push(next);
  }

  activeStim = {
    startTime: performance.now(),
    duration: 1600,
    layers: layers
  };

  showInfo(startIdx);
  highlightNeuron(startIdx);
}

function updateStim(now) {
  if (!activeStim) return;
  const t = (now - activeStim.startTime) / activeStim.duration;

  if (t >= 1) {
    for (const layer of activeStim.layers) {
      for (const idx of layer) {
        tmpColor.setRGB(baseColors[idx * 3], baseColors[idx * 3 + 1], baseColors[idx * 3 + 2]);
        instancedMesh.setColorAt(idx, tmpColor);
      }
    }
    instancedMesh.instanceColor.needsUpdate = true;
    activeStim = null;
    return;
  }

  const layerCount = activeStim.layers.length;
  for (let li = 0; li < layerCount; li++) {
    const layerT = Math.max(0, Math.min(1, (t * layerCount) - li));
    if (layerT <= 0) continue;
    const fade = Math.sin(layerT * Math.PI);

    for (const idx of activeStim.layers[li]) {
      tmpColor.setRGB(baseColors[idx * 3], baseColors[idx * 3 + 1], baseColors[idx * 3 + 2]);
      tmpColor.lerp(WHITE, fade * 0.85);
      instancedMesh.setColorAt(idx, tmpColor);
    }
  }
  instancedMesh.instanceColor.needsUpdate = true;
}

// ---------------------------------------------------------------
// Buttons
// ---------------------------------------------------------------
document.getElementById('btn-stim').addEventListener('click', () => {
  if (!neurons) return;
  const idx = (Math.random() * neurons.length) | 0;
  stimulate(idx);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.set(0, 0, 1200);
  controls.target.set(0, 0, 0);
  controls.update();
});

// ---------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------
const hudEl = document.getElementById('hud');
let lastFpsTime = performance.now();
let frameCount = 0;

function animate(now) {
  requestAnimationFrame(animate);
  controls.update();
  updateStim(now);
  renderer.render(scene, camera);

  frameCount++;
  if (now - lastFpsTime > 1000) {
    const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
    hudEl.innerHTML = `${fps} FPS<br>${neurons ? neurons.length.toLocaleString('en') : 0} neurons<br>${edgesLine ? (edgesLine.geometry.attributes.position.count / 2).toLocaleString('en') : 0} edges`;
    frameCount = 0;
    lastFpsTime = now;
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------
(async () => {
  try {
    const data = await loadBrain();
    buildNeurons(data);
    buildEdges(data);
    requestAnimationFrame(animate);
    loadingEl.style.opacity = '0';
    setTimeout(() => loadingEl.remove(), 400);
  } catch (err) {
    loadingEl.innerHTML = '<div style="color:#ef476f;padding:20px;text-align:center;">' + err.message + '</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
