<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<title>Testroum</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 14px; left: 14px; font-size: 11px; opacity: 0.55;
    pointer-events: none; letter-spacing: 0.4px; line-height: 1.6; }
  #info { position: fixed; bottom: 96px; left: 12px; right: 12px;
    background: rgba(18, 22, 40, 0.94); backdrop-filter: blur(12px);
    border-radius: 14px; padding: 14px 16px; font-size: 13px;
    display: none; border: 1px solid rgba(76, 201, 240, 0.35);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-height: 40vh; overflow-y: auto; }
  #info .title { font-weight: 700; margin-bottom: 6px; color: #4cc9f0; font-size: 14px; }
  #info .row { opacity: 0.85; font-size: 12px; margin-top: 4px; line-height: 1.5; }
  #info .row b { color: #ffd166; font-weight: 600; }
  #info .close { position: absolute; top: 10px; right: 14px; opacity: 0.5; font-size: 20px; cursor: pointer; }
  #controls { position: fixed; bottom: 16px; left: 12px; right: 12px; display: flex; gap: 8px; }
  button { flex: 1; padding: 14px 10px; border-radius: 12px;
    background: rgba(76, 201, 240, 0.12); color: #4cc9f0; font-size: 13px;
    font-weight: 600; border: 1px solid rgba(76, 201, 240, 0.4);
    backdrop-filter: blur(12px); cursor: pointer; transition: background 0.15s; }
  button:active { background: rgba(76, 201, 240, 0.35); transform: scale(0.98); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: #0a0a14; z-index: 10;
    font-size: 13px; transition: opacity 0.4s; }
  #loading .bar { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  #loading .bar div { height: 100%; width: 0%; background: #4cc9f0; transition: width 0.2s; }
  #loading .pct { opacity: 0.6; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="loading">
  <div>Loading MaleCNS connectome</div>
  <div class="bar"><div id="loadbar"></div></div>
  <div class="pct" id="loadpct">0 MB</div>
</div>
<div id="hud">-</div>
<div id="info"></div>
<div id="controls">
  <button id="btn-stim">Stimulate</button>
  <button id="btn-reset">Reset camera</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 5000);
camera.position.set(0, 0, 1200);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: 'high-performance',
  precision: 'mediump'
});
renderer.setPixelRatio(1.0);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;
controls.minDistance = 150;
controls.maxDistance = 3000;

// ---------------------------------------------------------------
// Circle texture shared by main points and glow
// ---------------------------------------------------------------
function makeCircleTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.55, 'rgba(255,255,255,0.9)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

const circleTexture = makeCircleTexture();

// ---------------------------------------------------------------
// Type colors
// ---------------------------------------------------------------
function hashStringToHue(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return (Math.abs(h) % 360) / 360;
}

const typeColorCache = new Map();
function colorForType(type) {
  if (typeColorCache.has(type)) return typeColorCache.get(type);
  const hue = hashStringToHue(type);
  const color = new THREE.Color().setHSL(hue, 0.65, 0.6);
  typeColorCache.set(type, color);
  return color;
}

// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let neurons = null;
let points = null;
let colorAttr = null;
let adjacency = null;
let reverseAdjacency = null;
let baseColors = null;
let currentEdgeMesh = null;
let highlightedIdx = -1;
let activeStim = null;

// ---------------------------------------------------------------
// Load brain.json
// ---------------------------------------------------------------
const loadbar = document.getElementById('loadbar');
const loadpct = document.getElementById('loadpct');
const loadingEl = document.getElementById('loading');

async function loadBrain() {
  const response = await fetch('brain.json');
  if (!response.ok) throw new Error('Failed to fetch brain.json: ' + response.status);

  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    loadpct.textContent = (received / 1024 / 1024).toFixed(1) + ' MB';
    loadbar.style.width = Math.min(100, received / 250000) + '%';
  }

  const blob = new Blob(chunks);
  const text = await blob.text();
  return JSON.parse(text);
}

// ---------------------------------------------------------------
// Build neurons
// ---------------------------------------------------------------
function buildNeurons(data) {
  neurons = data.nodes;
  const count = neurons.length;

  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  baseColors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const n = neurons[i];
    positions[i * 3] = n.x;
    positions[i * 3 + 1] = n.y;
    positions[i * 3 + 2] = n.z;

    const c = colorForType(n.type);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
    baseColors[i * 3] = c.r;
    baseColors[i * 3 + 1] = c.g;
    baseColors[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 7,
    sizeAttenuation: true,
    vertexColors: true,
    map: circleTexture,
    transparent: true,
    alphaTest: 0.1,
    depthWrite: false
  });

  points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  scene.add(points);

  colorAttr = geo.attributes.color;
}

// ---------------------------------------------------------------
// Adjacency
// ---------------------------------------------------------------
function buildAdjacency(data) {
  const edges = data.edges;
  adjacency = new Array(neurons.length);
  reverseAdjacency = new Array(neurons.length);
  for (let i = 0; i < neurons.length; i++) {
    adjacency[i] = [];
    reverseAdjacency[i] = [];
  }

  for (let i = 0; i < edges.length; i++) {
    const e = edges[i];
    adjacency[e.source].push({ target: e.target, weight: e.weight });
    reverseAdjacency[e.target].push({ source: e.source, weight: e.weight });
  }

  for (let i = 0; i < neurons.length; i++) {
    adjacency[i].sort((a, b) => b.weight - a.weight);
    reverseAdjacency[i].sort((a, b) => b.weight - a.weight);
  }
}

// ---------------------------------------------------------------
// Selected neuron edges
// ---------------------------------------------------------------
function clearEdgeMesh() {
  if (currentEdgeMesh) {
    scene.remove(currentEdgeMesh);
    currentEdgeMesh.geometry.dispose();
    currentEdgeMesh.material.dispose();
    currentEdgeMesh = null;
  }
}

function showNeuronEdges(idx, maxPerDirection) {
  clearEdgeMesh();

  const outgoing = adjacency[idx].slice(0, maxPerDirection);
  const incoming = reverseAdjacency[idx].slice(0, maxPerDirection);
  const total = outgoing.length + incoming.length;
  if (total === 0) return;

  const positions = new Float32Array(total * 6);
  const colors = new Float32Array(total * 6);
  const origin = neurons[idx];

  let o = 0;
  for (const c of outgoing) {
    const b = neurons[c.target];
    positions[o] = origin.x; positions[o + 1] = origin.y; positions[o + 2] = origin.z;
    positions[o + 3] = b.x; positions[o + 4] = b.y; positions[o + 5] = b.z;
    colors[o] = 0.30; colors[o + 1] = 0.79; colors[o + 2] = 0.94;
    colors[o + 3] = 0.30; colors[o + 4] = 0.79; colors[o + 5] = 0.94;
    o += 6;
  }
  for (const c of incoming) {
    const a = neurons[c.source];
    positions[o] = a.x; positions[o + 1] = a.y; positions[o + 2] = a.z;
    positions[o + 3] = origin.x; positions[o + 4] = origin.y; positions[o + 5] = origin.z;
    colors[o] = 0.94; colors[o + 1] = 0.28; colors[o + 2] = 0.44;
    colors[o + 3] = 0.94; colors[o + 4] = 0.28; colors[o + 5] = 0.44;
    o += 6;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.8
  });

  currentEdgeMesh = new THREE.LineSegments(geo, mat);
  currentEdgeMesh.frustumCulled = false;
  scene.add(currentEdgeMesh);
}

// ---------------------------------------------------------------
// Tap detection
// ---------------------------------------------------------------
const infoEl = document.getElementById('info');
let pointerDownTime = 0, pointerDownX = 0, pointerDownY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownTime = performance.now();
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const dt = performance.now() - pointerDownTime;
  const dx = e.clientX - pointerDownX;
  const dy = e.clientY - pointerDownY;
  if (dt > 350 || Math.hypot(dx, dy) > 12) return;

  const rect = renderer.domElement.getBoundingClientRect();
  const tapX = e.clientX - rect.left;
  const tapY = e.clientY - rect.top;
  const TAP_RADIUS_PX = 45;

  let bestIdx = -1;
  let bestDist = TAP_RADIUS_PX;
  const v = new THREE.Vector3();

  for (let i = 0; i < neurons.length; i++) {
    const n = neurons[i];
    v.set(n.x, n.y, n.z).project(camera);
    if (v.z > 1) continue;
    const sx = (v.x * 0.5 + 0.5) * rect.width;
    const sy = (-v.y * 0.5 + 0.5) * rect.height;
    const dist = Math.hypot(sx - tapX, sy - tapY);
    if (dist < bestDist) {
      bestDist = dist;
      bestIdx = i;
    }
  }

  if (bestIdx !== -1) {
    showInfo(bestIdx);
    highlightNeuron(bestIdx);
    showNeuronEdges(bestIdx, 60);
  } else {
    infoEl.style.display = 'none';
    clearEdgeMesh();
    unhighlight();
  }
});

function setPointColor(idx, r, g, b) {
  colorAttr.array[idx * 3] = r;
  colorAttr.array[idx * 3 + 1] = g;
  colorAttr.array[idx * 3 + 2] = b;
}

function highlightNeuron(idx) {
  if (highlightedIdx !== -1 && highlightedIdx !== idx) {
    const p = baseColors;
    setPointColor(highlightedIdx, p[highlightedIdx*3], p[highlightedIdx*3+1], p[highlightedIdx*3+2]);
  }
  setPointColor(idx, 1, 1, 1);
  colorAttr.needsUpdate = true;
  highlightedIdx = idx;
}

function unhighlight() {
  if (highlightedIdx === -1) return;
  const p = baseColors;
  setPointColor(highlightedIdx, p[highlightedIdx*3], p[highlightedIdx*3+1], p[highlightedIdx*3+2]);
  colorAttr.needsUpdate = true;
  highlightedIdx = -1;
}

function showInfo(idx) {
  const n = neurons[idx];
  const out = adjacency[idx].length;
  const inc = reverseAdjacency[idx].length;

  infoEl.innerHTML = `
    <div class="close" onclick="document.getElementById('info').style.display='none'">x</div>
    <div class="title">Neuron #${idx}</div>
    <div class="row">Type: <b>${n.type}</b></div>
    <div class="row">Outgoing: <b>${out}</b> (showing 60)</div>
    <div class="row">Incoming: <b>${inc}</b> (showing 60)</div>
  `;
  infoEl.style.display = 'block';
}

// ---------------------------------------------------------------
// Stimulation with dedicated glow layers
// ---------------------------------------------------------------
function clearStim() {
  if (!activeStim) return;
  for (const layer of activeStim.layerMeshes) {
    scene.remove(layer.points);
    layer.points.geometry.dispose();
    layer.points.material.dispose();
  }
  activeStim = null;
}

function buildStimLayers(startIdx) {
  const MAX_HOPS = 4;
  const PER_HOP = 40;

  const visited = new Set([startIdx]);
  const layers = [[startIdx]];

  for (let hop = 0; hop < MAX_HOPS; hop++) {
    const prev = layers[layers.length - 1];
    const next = [];
    for (const idx of prev) {
      for (const conn of adjacency[idx]) {
        if (next.length >= PER_HOP) break;
        if (!visited.has(conn.target)) {
          visited.add(conn.target);
          next.push(conn.target);
        }
      }
      if (next.length >= PER_HOP) break;
    }
    if (next.length === 0) break;
    layers.push(next);
  }
  return layers;
}

function stimulate(startIdx) {
  clearStim();

  const layers = buildStimLayers(startIdx);

  const layerMeshes = [];
  for (let li = 0; li < layers.length; li++) {
    const positions = new Float32Array(layers[li].length * 3);
    for (let i = 0; i < layers[li].length; i++) {
      const n = neurons[layers[li][i]];
      positions[i*3] = n.x;
      positions[i*3+1] = n.y;
      positions[i*3+2] = n.z;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      size: 20,
      map: circleTexture,
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      sizeAttenuation: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    scene.add(pts);

    layerMeshes.push({ points: pts, layerIndex: li });
  }

  activeStim = {
    startTime: performance.now(),
    duration: 1800,
    layerCount: layers.length,
    layerMeshes: layerMeshes
  };
}

function updateStim(now) {
  if (!activeStim) return;
  const t = (now - activeStim.startTime) / activeStim.duration;

  if (t >= 1) {
    clearStim();
    return;
  }

  const L = activeStim.layerCount;
  for (const lm of activeStim.layerMeshes) {
    const layerStart = lm.layerIndex / L;
    const layerSpan = 2 / L;
    const lt = (t - layerStart) / layerSpan;

    if (lt < 0 || lt > 1) {
      lm.points.material.opacity = 0;
      continue;
    }

    const pulse = Math.sin(lt * Math.PI);
    lm.points.material.opacity = pulse;
    lm.points.material.size = 18 + pulse * 35;
  }
}

// ---------------------------------------------------------------
// Buttons
// ---------------------------------------------------------------
document.getElementById('btn-stim').addEventListener('click', () => {
  if (!neurons) return;

  let target = highlightedIdx;
  if (target === -1) {
    target = (Math.random() * neurons.length) | 0;
    highlightNeuron(target);
  }

  showInfo(target);
  showNeuronEdges(target, 60);
  stimulate(target);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.set(0, 0, 1200);
  controls.target.set(0, 0, 0);
  controls.update();
  clearEdgeMesh();
  clearStim();
  unhighlight();
  infoEl.style.display = 'none';
});

// ---------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------
const hudEl = document.getElementById('hud');
let lastFpsTime = performance.now();
let frameCount = 0;

function animate(now) {
  requestAnimationFrame(animate);
  controls.update();
  updateStim(now);
  renderer.render(scene, camera);

  frameCount++;
  if (now - lastFpsTime > 1000) {
    const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
    const w = renderer.domElement.width;
    const h = renderer.domElement.height;
    hudEl.innerHTML = `${fps} FPS<br>${neurons ? neurons.length.toLocaleString('en') : 0} neurons<br>${w}x${h}`;
    frameCount = 0;
    lastFpsTime = now;
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------
(async () => {
  try {
    const data = await loadBrain();
    buildNeurons(data);
    buildAdjacency(data);
    requestAnimationFrame(animate);
    loadingEl.style.opacity = '0';
    setTimeout(() => loadingEl.remove(), 400);
  } catch (err) {
    loadingEl.innerHTML = '<div style="color:#ef476f;padding:20px;text-align:center;">' + err.message + '</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
